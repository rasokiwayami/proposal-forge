schema_version: 6

project:
  repo: rasokiwayami/proposal-forge
  type: portfolio_product_candidate
  domain: proposal_generation
  primary_goal: Next.js proposal generation app with product-local Gemini analysis pipeline
  default_branch: main
  visibility: private_or_public_per_current_remote
  authority:
    # These are target-local filters; central authority and task evidence still decide execution.
    allowed_actions:
      - dev.local_inspect
      - dev.local_edit
      - dev.local_test
      - dev.local_commit
    forbidden_actions:
      - dev.repo_create_visibility_deploy_or_publish
      - dev.secret_or_security_mutation
      - dev.production_data_mutation
      - auth.secret_read_or_print
      - finance.spending_or_paid_service_change
      - dev.destructive_action

runtime:
  local_only: true
  deployment: vercel_or_next_configured_but_not_default_action
  languages:
    - typescript
  package_managers:
    - pnpm
  operating_environment:
    - Mac local operation under /Users/sora/dev/proposal-forge
    - Legacy Windows/WSL operation remains a normal Node/Next.js context

verification:
  default:
    - pnpm lint
    - pnpm build
  formatting:
    - git diff --check

state:
  ignored_runtime_dirs:
    - node_modules/
    - .next/
    - coverage/
    - output/
  canonical_progress:
    - AGENTS.md
    - PROJECT_PROFILE.yaml
    - CLAUDE.md
    - package.json
    - src/
